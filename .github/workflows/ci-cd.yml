name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  LOCAL_IMAGE: dmc-268-ui:ci

jobs:
  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      immutable: ${{ steps.meta.outputs.immutable }}
      staging: ${{ steps.meta.outputs.staging }}
      previous: ${{ steps.meta.outputs.previous }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set image coordinates
        id: meta
        run: |
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          image="${REGISTRY}/${repo}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "immutable=${image}:${{ github.sha }}" >> "${GITHUB_OUTPUT}"
          echo "staging=${image}:staging" >> "${GITHUB_OUTPUT}"
          echo "previous=${image}:staging-previous" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Export image artifact
        run: docker save "${LOCAL_IMAGE}" | gzip > /tmp/docker-image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-image
          path: /tmp/docker-image.tar.gz
          retention-days: 1

  docker-scan:
    name: Docker image security scan
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docker-image

      - name: Load image
        run: gunzip -c docker-image.tar.gz | docker load

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          format: table
          scanners: vuln,secret,misconfig

  push-image:
    name: Push Docker image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
    needs:
      - docker-build
      - docker-scan
    outputs:
      image_ref: ${{ steps.push.outputs.image_ref }}
      staging: ${{ needs.docker-build.outputs.staging }}
      previous: ${{ needs.docker-build.outputs.previous }}
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docker-image

      - name: Set tags
        id: tags
        run: |
          echo "immutable=${{ needs.docker-build.outputs.immutable }}" >> "${GITHUB_OUTPUT}"

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load and push scanned image
        id: push
        run: |
          gunzip -c docker-image.tar.gz | docker load
          immutable="${{ steps.tags.outputs.immutable }}"
          docker tag "${LOCAL_IMAGE}" "${immutable}"
          docker push "${immutable}"
          image_ref="$(docker inspect --format='{{index .RepoDigests 0}}' "${immutable}")"
          if [[ -z "${image_ref}" || "${image_ref}" == "<no value>" ]]; then
            echo "failed to resolve pushed image digest" >&2
            exit 1
          fi
          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"
          echo "pushed ${image_ref}"

  deploy-staging:
    name: Deploy staging
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    needs: push-image
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    environment:
      name: staging
      url: ${{ steps.target.outputs.base_url }}
    outputs:
      promote: ${{ steps.result.outputs.promote }}
      image_ref: ${{ needs.push-image.outputs.image_ref }}
      staging: ${{ needs.push-image.outputs.staging }}
    steps:
      - name: Resolve staging target
        id: target
        env:
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
          STAGING_HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
          HAS_STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY != '' }}
          VPS_HOST: ${{ vars.VPS_DMC268_IP_T6 }}
          HAS_VPS_USER: ${{ secrets.VPS_DMC268_U != '' }}
          HAS_VPS_PASSWORD: ${{ secrets.VPS_DMC268_P != '' }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          STAGING_SSH_FINGERPRINT: ${{ vars.STAGING_SSH_FINGERPRINT }}
        run: |
          # Terraform/Hetzner host (key auth, UI on host port 80) when STAGING_HOST is set, otherwise
          # the shared course VPS (password auth, port 22, UI behind the edge proxy as ui-staging).
          # Only non-secret values go to the step outputs.
          if [[ -n "${STAGING_HOST}" ]]; then
            mode=terraform
            host="${STAGING_HOST}"
            port="${STAGING_SSH_PORT}"
            if [[ ! "${port}" =~ ^[0-9]+$ ]]; then
              echo "GitHub variable STAGING_SSH_PORT (environment staging) must be set to the sshd port (Terraform output ssh_port, default 22022)" >&2
              exit 1
            fi
            if [[ -z "${STAGING_SSH_USER}" || "${HAS_STAGING_SSH_KEY}" != "true" ]]; then
              echo "Terraform target needs variable STAGING_SSH_USER and secret STAGING_SSH_KEY (environment staging)" >&2
              exit 1
            fi
            # cloud-init creates this dir and starts the dmc-268-ui-bootstrap placeholder on port 80.
            app_dir=/opt/dmc-268-ui
            deploy_mode=ports
            edge_alias=""
            base_url="http://${host}"
            health_url="${STAGING_HEALTH_URL:-${base_url}/health}"
          elif [[ -n "${VPS_HOST}" ]]; then
            mode=course
            host="${VPS_HOST}"
            port=22
            if [[ "${HAS_VPS_USER}" != "true" || "${HAS_VPS_PASSWORD}" != "true" ]]; then
              echo "Course VPS target needs organization secrets VPS_DMC268_U and VPS_DMC268_P" >&2
              exit 1
            fi
            if [[ ! "${APP_DOMAIN}" =~ ^[a-z0-9-]+(\.[a-z0-9-]+)+$ ]]; then
              echo "Course VPS target needs repository variable APP_DOMAIN (base domain of the edge proxy routes)" >&2
              exit 1
            fi
            app_dir=/opt/dmc-268-ui-staging
            deploy_mode=edge
            edge_alias=ui-staging
            base_url="https://staging-ui.${APP_DOMAIN}"
            health_url="${base_url}/health"
          else
            echo "No staging target: set STAGING_HOST, STAGING_SSH_PORT, STAGING_SSH_USER and STAGING_SSH_KEY (Terraform host)" \
              "or organization variable VPS_DMC268_IP_T6 with secrets VPS_DMC268_U and VPS_DMC268_P (course VPS)" >&2
            exit 1
          fi
          if [[ ! "${host}" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "staging host '${host}' is not a hostname or IPv4 address" >&2
            exit 1
          fi
          # With an empty fingerprint the appleboy actions accept any host key.
          if [[ ! "${STAGING_SSH_FINGERPRINT}" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo "GitHub variable STAGING_SSH_FINGERPRINT must be the ${mode} host key fingerprint SHA256:<43 base64 chars> (ssh-keyscan -p ${port} ${host} | ssh-keygen -lf - -E sha256)" >&2
            exit 1
          fi
          # One key=value line per output: a CR/LF inside a value (e.g. from STAGING_HEALTH_URL) could
          # otherwise append lines that override mode, host or port.
          for value in "${mode}" "${host}" "${port}" "${app_dir}" "${deploy_mode}" "${edge_alias}" "${base_url}" "${health_url}"; do
            if [[ "${value}" == *$'\n'* || "${value}" == *$'\r'* ]]; then
              echo "staging target values must be single-line" >&2
              exit 1
            fi
          done
          for url in "${base_url}" "${health_url}"; do
            if [[ ! "${url}" =~ ^https?://[^[:space:]]+$ ]]; then
              echo "staging URL '${url}' must be http(s)://<host>[/path] without whitespace" >&2
              exit 1
            fi
          done
          {
            echo "mode=${mode}"
            echo "host=${host}"
            echo "port=${port}"
            echo "app_dir=${app_dir}"
            echo "deploy_mode=${deploy_mode}"
            echo "edge_alias=${edge_alias}"
            echo "base_url=${base_url}"
            echo "health_url=${health_url}"
          } >> "${GITHUB_OUTPUT}"
          echo "staging target: ${mode} (${host}:${port}, ${base_url})"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Upload deploy files
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ steps.target.outputs.host }}
          port: ${{ steps.target.outputs.port }}
          username: ${{ steps.target.outputs.mode == 'course' && secrets.VPS_DMC268_U || vars.STAGING_SSH_USER }}
          key: ${{ steps.target.outputs.mode == 'terraform' && secrets.STAGING_SSH_KEY || '' }}
          password: ${{ steps.target.outputs.mode == 'course' && secrets.VPS_DMC268_P || '' }}
          fingerprint: ${{ vars.STAGING_SSH_FINGERPRINT }}
          source: 'deploy/compose/staging.yml,deploy/scripts/deploy.sh,deploy/scripts/rollback.sh,deploy/scripts/healthcheck.sh'
          target: ${{ steps.target.outputs.app_dir }}
          strip_components: 2

      - name: Deploy image
        id: deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ${{ needs.push-image.outputs.image_ref }}
          APP_DIR: ${{ steps.target.outputs.app_dir }}
        with:
          host: ${{ steps.target.outputs.host }}
          port: ${{ steps.target.outputs.port }}
          username: ${{ steps.target.outputs.mode == 'course' && secrets.VPS_DMC268_U || vars.STAGING_SSH_USER }}
          key: ${{ steps.target.outputs.mode == 'terraform' && secrets.STAGING_SSH_KEY || '' }}
          password: ${{ steps.target.outputs.mode == 'course' && secrets.VPS_DMC268_P || '' }}
          fingerprint: ${{ vars.STAGING_SSH_FINGERPRINT }}
          debug: false
          envs: GHCR_TOKEN,GHCR_USER,IMAGE,APP_DIR
          script: |
            set -euo pipefail
            set +o xtrace
            cd "${APP_DIR}"
            mv staging.yml compose.yml
            chmod +x deploy.sh rollback.sh healthcheck.sh
            ./deploy.sh "${IMAGE}"

      - name: Health check
        id: health
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          HEALTH_URL: ${{ steps.target.outputs.health_url }}
        run: |
          chmod +x deploy/scripts/healthcheck.sh
          deploy/scripts/healthcheck.sh "${HEALTH_URL}"

      - name: Rollback on failed deploy or health check
        id: rollback
        if: always() && (steps.deploy.outcome == 'failure' || steps.health.outcome == 'failure')
        continue-on-error: true
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          APP_DIR: ${{ steps.target.outputs.app_dir }}
        with:
          host: ${{ steps.target.outputs.host }}
          port: ${{ steps.target.outputs.port }}
          username: ${{ steps.target.outputs.mode == 'course' && secrets.VPS_DMC268_U || vars.STAGING_SSH_USER }}
          key: ${{ steps.target.outputs.mode == 'terraform' && secrets.STAGING_SSH_KEY || '' }}
          password: ${{ steps.target.outputs.mode == 'course' && secrets.VPS_DMC268_P || '' }}
          fingerprint: ${{ vars.STAGING_SSH_FINGERPRINT }}
          debug: false
          envs: GHCR_TOKEN,GHCR_USER,APP_DIR
          script: |
            set -euo pipefail
            set +o xtrace
            ROLLBACK_MODE=auto "${APP_DIR}/rollback.sh"

      - name: Set promote flag
        id: result
        if: always()
        run: |
          if [[ "${{ steps.deploy.outcome }}" == "success" && "${{ steps.health.outcome }}" == "success" ]]; then
            echo "promote=true" >> "${GITHUB_OUTPUT}"
          else
            echo "promote=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Fail the pipeline after rollback
        if: always() && (steps.deploy.outcome == 'failure' || steps.health.outcome == 'failure')
        run: |
          if [[ "${{ steps.deploy.outcome }}" == "failure" ]]; then
            echo "staging deploy failed; rollback was triggered"
          else
            echo "staging health check failed; rollback was triggered"
          fi
          if [[ "${{ steps.rollback.outcome }}" == "failure" ]]; then
            echo "rollback failed" >&2
            exit 1
          fi
          exit 1

  promote-staging:
    name: Promote staging tag
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.deploy-staging.outputs.promote == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - push-image
      - deploy-staging
    # Same lock as deploy-staging and the rollback workflow: a manual rollback cannot run
    # between the VM check below and the tag push.
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    # Terraform SSH host, port, user and key are scoped to the staging environment.
    environment:
      name: staging
    steps:
      - name: Resolve staging target
        id: target
        env:
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
          STAGING_HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
          HAS_STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY != '' }}
          VPS_HOST: ${{ vars.VPS_DMC268_IP_T6 }}
          HAS_VPS_USER: ${{ secrets.VPS_DMC268_U != '' }}
          HAS_VPS_PASSWORD: ${{ secrets.VPS_DMC268_P != '' }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          STAGING_SSH_FINGERPRINT: ${{ vars.STAGING_SSH_FINGERPRINT }}
        run: |
          # Terraform/Hetzner host (key auth, UI on host port 80) when STAGING_HOST is set, otherwise
          # the shared course VPS (password auth, port 22, UI behind the edge proxy as ui-staging).
          # Only non-secret values go to the step outputs.
          if [[ -n "${STAGING_HOST}" ]]; then
            mode=terraform
            host="${STAGING_HOST}"
            port="${STAGING_SSH_PORT}"
            if [[ ! "${port}" =~ ^[0-9]+$ ]]; then
              echo "GitHub variable STAGING_SSH_PORT (environment staging) must be set to the sshd port (Terraform output ssh_port, default 22022)" >&2
              exit 1
            fi
            if [[ -z "${STAGING_SSH_USER}" || "${HAS_STAGING_SSH_KEY}" != "true" ]]; then
              echo "Terraform target needs variable STAGING_SSH_USER and secret STAGING_SSH_KEY (environment staging)" >&2
              exit 1
            fi
            # cloud-init creates this dir and starts the dmc-268-ui-bootstrap placeholder on port 80.
            app_dir=/opt/dmc-268-ui
            deploy_mode=ports
            edge_alias=""
            base_url="http://${host}"
            health_url="${STAGING_HEALTH_URL:-${base_url}/health}"
          elif [[ -n "${VPS_HOST}" ]]; then
            mode=course
            host="${VPS_HOST}"
            port=22
            if [[ "${HAS_VPS_USER}" != "true" || "${HAS_VPS_PASSWORD}" != "true" ]]; then
              echo "Course VPS target needs organization secrets VPS_DMC268_U and VPS_DMC268_P" >&2
              exit 1
            fi
            if [[ ! "${APP_DOMAIN}" =~ ^[a-z0-9-]+(\.[a-z0-9-]+)+$ ]]; then
              echo "Course VPS target needs repository variable APP_DOMAIN (base domain of the edge proxy routes)" >&2
              exit 1
            fi
            app_dir=/opt/dmc-268-ui-staging
            deploy_mode=edge
            edge_alias=ui-staging
            base_url="https://staging-ui.${APP_DOMAIN}"
            health_url="${base_url}/health"
          else
            echo "No staging target: set STAGING_HOST, STAGING_SSH_PORT, STAGING_SSH_USER and STAGING_SSH_KEY (Terraform host)" \
              "or organization variable VPS_DMC268_IP_T6 with secrets VPS_DMC268_U and VPS_DMC268_P (course VPS)" >&2
            exit 1
          fi
          if [[ ! "${host}" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "staging host '${host}' is not a hostname or IPv4 address" >&2
            exit 1
          fi
          # With an empty fingerprint the appleboy actions accept any host key.
          if [[ ! "${STAGING_SSH_FINGERPRINT}" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo "GitHub variable STAGING_SSH_FINGERPRINT must be the ${mode} host key fingerprint SHA256:<43 base64 chars> (ssh-keyscan -p ${port} ${host} | ssh-keygen -lf - -E sha256)" >&2
            exit 1
          fi
          # One key=value line per output: a CR/LF inside a value (e.g. from STAGING_HEALTH_URL) could
          # otherwise append lines that override mode, host or port.
          for value in "${mode}" "${host}" "${port}" "${app_dir}" "${deploy_mode}" "${edge_alias}" "${base_url}" "${health_url}"; do
            if [[ "${value}" == *$'\n'* || "${value}" == *$'\r'* ]]; then
              echo "staging target values must be single-line" >&2
              exit 1
            fi
          done
          for url in "${base_url}" "${health_url}"; do
            if [[ ! "${url}" =~ ^https?://[^[:space:]]+$ ]]; then
              echo "staging URL '${url}' must be http(s)://<host>[/path] without whitespace" >&2
              exit 1
            fi
          done
          {
            echo "mode=${mode}"
            echo "host=${host}"
            echo "port=${port}"
            echo "app_dir=${app_dir}"
            echo "deploy_mode=${deploy_mode}"
            echo "edge_alias=${edge_alias}"
            echo "base_url=${base_url}"
            echo "health_url=${health_url}"
          } >> "${GITHUB_OUTPUT}"
          echo "staging target: ${mode} (${host}:${port}, ${base_url})"

      # Read-only SSH: no registry token is forwarded to the VM, only the app dir.
      - name: Read deployed image
        id: deployed
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          APP_DIR: ${{ steps.target.outputs.app_dir }}
        with:
          host: ${{ steps.target.outputs.host }}
          port: ${{ steps.target.outputs.port }}
          username: ${{ steps.target.outputs.mode == 'course' && secrets.VPS_DMC268_U || vars.STAGING_SSH_USER }}
          key: ${{ steps.target.outputs.mode == 'terraform' && secrets.STAGING_SSH_KEY || '' }}
          password: ${{ steps.target.outputs.mode == 'course' && secrets.VPS_DMC268_P || '' }}
          fingerprint: ${{ vars.STAGING_SSH_FINGERPRINT }}
          debug: false
          capture_stdout: true
          envs: APP_DIR
          script: |
            state="${APP_DIR}/.deploy-state"
            if [[ -f "${state}" ]]; then
              awk -F= '/^current_image=/{print "current_image=" $2; exit}' "${state}"
            else
              echo "bootstrap=true"
            fi

      - name: Check staging still runs this digest
        id: guard
        env:
          DEPLOYED_STDOUT: ${{ steps.deployed.outputs.stdout }}
          EXPECTED_IMAGE: ${{ needs.deploy-staging.outputs.image_ref }}
        run: |
          # capture_stdout also returns drone-ssh's own banner (and any stderr lines): only the
          # keyed line counts.
          running="$(awk '/^current_image=/ { sub(/^current_image=/, ""); sub(/\r$/, ""); print; exit } /^bootstrap=true/ { print "bootstrap"; exit }' <<< "${DEPLOYED_STDOUT}")"
          if [[ -n "${EXPECTED_IMAGE}" && "${running}" == "${EXPECTED_IMAGE}" ]]; then
            echo "promote=true" >> "${GITHUB_OUTPUT}"
            echo "staging still runs ${running}"
          else
            echo "promote=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::staging runs '${running:-<unknown>}', not ${EXPECTED_IMAGE}: a rollback ran after this deploy, skipping promotion"
          fi

      - name: Promote verified digest to staging
        if: steps.guard.outputs.promote == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image_ref="${{ needs.deploy-staging.outputs.image_ref }}"
          staging="${{ needs.push-image.outputs.staging }}"
          previous="${{ needs.push-image.outputs.previous }}"
          if [[ -z "${image_ref}" ]]; then
            echo "deployed image reference is empty; refusing to promote registry tags" >&2
            exit 1
          fi
          docker pull "${image_ref}"
          if docker pull "${staging}"; then
            docker tag "${staging}" "${previous}"
            docker push "${previous}"
          else
            echo "no existing staging image; skip previous-tag"
          fi
          docker tag "${image_ref}" "${staging}"
          docker push "${staging}"
          echo "promoted ${image_ref} to ${staging}"
