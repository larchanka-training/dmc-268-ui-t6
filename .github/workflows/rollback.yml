name: Rollback staging

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Image tag or digest. Leave empty to restore the previous successful deploy.'
        required: false
        type: string
      reason:
        description: 'Why staging is being rolled back'
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback staging
    runs-on: ${{ fromJSON(vars.STAGING_RUNNER) }}
    permissions:
      contents: read
      packages: read
    environment:
      name: staging
      url: http://${{ vars.STAGING_HOST }}
    outputs:
      image_ref: ${{ steps.target.outputs.image_ref }}
      staging: ${{ steps.meta.outputs.staging }}
      previous: ${{ steps.meta.outputs.previous }}
      promote: ${{ steps.result.outputs.promote }}
    steps:
      - name: Set image coordinates
        id: meta
        env:
          REGISTRY: ghcr.io
        run: |
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          image="${REGISTRY}/${repo}"
          echo "staging=${image}:staging" >> "${GITHUB_OUTPUT}"
          echo "previous=${image}:staging-previous" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve requested ref
        id: image
        env:
          REQUESTED: ${{ inputs.image }}
          REPOSITORY: ${{ github.repository }}
        run: |
          repo="$(echo "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          if [[ -n "${REQUESTED}" ]]; then
            if [[ "${REQUESTED}" == *'/'* ]]; then
              echo "ref=${REQUESTED}" >> "${GITHUB_OUTPUT}"
            else
              echo "ref=ghcr.io/${repo}:${REQUESTED}" >> "${GITHUB_OUTPUT}"
            fi
          else
            echo "ref=" >> "${GITHUB_OUTPUT}"
          fi

      - name: Read previous deploy from VM
        if: steps.image.outputs.ref == ''
        id: vm_previous
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ vars.STAGING_HOST }}
          username: ${{ vars.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          fingerprint: ${{ vars.STAGING_SSH_FINGERPRINT }}
          debug: false
          capture_stdout: true
          script: |
            if [[ -f /opt/dmc-268-ui/.deploy-state.previous ]]; then
              awk -F= '/^current_image=/{print $2; exit}' /opt/dmc-268-ui/.deploy-state.previous
            fi

      - name: Resolve rollback target to digest
        id: target
        env:
          REQUESTED_REF: ${{ steps.image.outputs.ref }}
          VM_PREVIOUS: ${{ steps.vm_previous.outputs.stdout }}
          STAGING_PREVIOUS: ${{ steps.meta.outputs.previous }}
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          if [[ -n "${REQUESTED_REF}" ]]; then
            candidate="${REQUESTED_REF}"
          elif [[ -n "${VM_PREVIOUS}" ]]; then
            candidate="${VM_PREVIOUS}"
          else
            candidate="${STAGING_PREVIOUS}"
          fi

          if [[ -z "${candidate}" ]]; then
            echo "bootstrap=true" >> "${GITHUB_OUTPUT}"
            echo "no rollback target; will restore bootstrap container"
            exit 0
          fi

          if [[ "${candidate}" == *'@sha256:'* ]]; then
            if ! docker pull "${candidate}"; then
              echo "failed to pull ${candidate}" >&2
              exit 1
            fi
            image_ref="${candidate}"
          else
            if ! docker pull "${candidate}"; then
              if [[ -z "${REQUESTED_REF}" && -z "${VM_PREVIOUS}" ]]; then
                echo "bootstrap=true" >> "${GITHUB_OUTPUT}"
                echo "registry previous tag missing; will restore bootstrap container"
                exit 0
              fi
              echo "failed to pull ${candidate}" >&2
              exit 1
            fi
            image_ref="$(docker inspect --format='{{index .RepoDigests 0}}' "${candidate}")"
          fi

          if [[ -z "${image_ref}" || "${image_ref}" == "<no value>" ]]; then
            echo "failed to resolve rollback target to immutable digest for ${candidate}" >&2
            exit 1
          fi

          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"
          echo "resolved rollback target ${image_ref}"

      - name: Rollback
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ${{ steps.target.outputs.image_ref }}
        with:
          host: ${{ vars.STAGING_HOST }}
          username: ${{ vars.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          fingerprint: ${{ vars.STAGING_SSH_FINGERPRINT }}
          debug: false
          envs: GHCR_TOKEN,GHCR_USER,IMAGE
          script: |
            set -euo pipefail
            set +o xtrace
            if [[ -n "${IMAGE}" ]]; then
              /opt/dmc-268-ui/rollback.sh "${IMAGE}"
            else
              /opt/dmc-268-ui/rollback.sh
            fi

      - name: Health check
        id: health
        env:
          HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
          STAGING_HOST: ${{ vars.STAGING_HOST }}
        run: |
          chmod +x deploy/scripts/healthcheck.sh
          target="${HEALTH_URL:-http://${STAGING_HOST}/health}"
          deploy/scripts/healthcheck.sh "${target}"

      - name: Read deployed image
        id: deployed
        if: steps.health.outcome == 'success'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ vars.STAGING_HOST }}
          username: ${{ vars.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          fingerprint: ${{ vars.STAGING_SSH_FINGERPRINT }}
          debug: false
          capture_stdout: true
          script: |
            awk -F= '/^current_image=/{print $2; exit}' /opt/dmc-268-ui/.deploy-state

      - name: Set promote flag
        id: result
        if: always()
        run: |
          if [[ "${{ steps.health.outcome }}" != "success" ]]; then
            echo "promote=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${{ steps.target.outputs.bootstrap }}" == "true" ]]; then
            echo "promote=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          deployed_ref="${{ steps.deployed.outputs.stdout }}"
          expected_ref="${{ steps.target.outputs.image_ref }}"
          if [[ -z "${deployed_ref}" ]]; then
            echo "deployed image reference is empty; refusing to promote registry tags" >&2
            echo "promote=false" >> "${GITHUB_OUTPUT}"
            exit 1
          fi
          if [[ "${deployed_ref}" != "${expected_ref}" ]]; then
            echo "deployed image ${deployed_ref} does not match resolved target ${expected_ref}" >&2
            echo "promote=false" >> "${GITHUB_OUTPUT}"
            exit 1
          fi
          echo "promote=true" >> "${GITHUB_OUTPUT}"

      - name: Fail on health check error
        if: steps.health.outcome == 'failure'
        run: exit 1

  promote-staging:
    name: Promote staging tag
    if: needs.rollback.outputs.promote == 'true'
    needs: rollback
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Promote rolled-back image to staging
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image_ref="${{ needs.rollback.outputs.image_ref }}"
          staging="${{ needs.rollback.outputs.staging }}"
          previous="${{ needs.rollback.outputs.previous }}"
          if [[ -z "${image_ref}" ]]; then
            echo "deployed image reference is empty; refusing to promote registry tags" >&2
            exit 1
          fi
          docker pull "${image_ref}"
          if docker pull "${staging}"; then
            docker tag "${staging}" "${previous}"
            docker push "${previous}"
          else
            echo "no existing staging image; skip previous-tag"
          fi
          docker tag "${image_ref}" "${staging}"
          docker push "${staging}"
          echo "promoted ${image_ref} to ${staging}"
