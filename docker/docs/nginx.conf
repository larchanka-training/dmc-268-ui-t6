# User docs (docs-site/, Next.js static export with basePath /docs). The edge proxy sends /docs and
# /docs/* on the landing host here unchanged, so the files sit under /usr/share/nginx/html/docs
# and every location below starts with /docs. /health stays at the root for the container check.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # Behind the proxy the container's own scheme and port must never leak into a Location header.
    absolute_redirect off;

    # Next.js and Fumadocs inline their bootstrap and theme scripts; the mockup pages load in an
    # iframe of the same origin, hence 'unsafe-inline' for scripts and frame-ancestors 'self'.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; frame-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    error_page 404 /docs/404.html;

    location = /health {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"status":"ok","service":"dmc-268-docs"}';
    }

    # The same answer through the edge proxy: the external check (deploy/scripts/docs-healthcheck.sh)
    # proves that /docs/* on the landing host reaches this container, not the landing.
    location = /docs/health {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"status":"ok","service":"dmc-268-docs"}';
    }

    # The Introduction is the base path itself (out/index.html).
    location = /docs {
        try_files /docs/index.html =404;
    }

    location = /docs/ {
        try_files /docs/index.html =404;
    }

    # Search index written at build time (app/api/search, static GET); the browser searches it.
    location = /docs/api/search {
        default_type application/json;
        try_files $uri =404;
    }

    # Content-hashed build assets.
    # A location-level add_header drops the server-level ones, so the security headers repeat here.
    location /docs/_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # Pages: /docs/quickstart -> quickstart.html; the RSC payloads (*.txt) are plain files.
    location /docs/ {
        try_files $uri $uri.html $uri/index.html =404;
    }

    location / {
        return 404;
    }
}
