server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /health {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"status":"ok","service":"dmc-268-landing"}';
    }

    # Runtime config the landing reads at startup (landing/src/lib/appUrl.ts): {"appUrl":"<APP_URL>"},
    # rendered at container start from docker/landing/config.json.template. no-cache: a browser
    # revalidates it on every load, so a new APP_URL takes effect without waiting for a cache.
    # A location-level add_header drops the server-level ones, so the security headers repeat here.
    location = /config.json {
        alias /etc/nginx/runtime/config.json;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
