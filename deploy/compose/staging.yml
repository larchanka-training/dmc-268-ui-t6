# Base stack. The project name comes from deploy.sh (-p <app dir basename>), the published port
# or the edge network from an override: compose.ports.yml (dedicated host) or compose.edge.yml
# (course VPS).
services:
  ui:
    image: ${IMAGE:?IMAGE is required}
    restart: unless-stopped
    pull_policy: always
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
