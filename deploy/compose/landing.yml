# Landing stack, course VPS only (edge mode; the Terraform host has no landing). Deployed by the
# same deploy.sh / rollback.sh as the UI, from its own APP_DIR (/opt/dmc-268-landing-staging) and
# compose project. APP_URL (the app address behind the landing buttons) is read at container
# start and rendered into /config.json, so one image serves any environment.
services:
  landing:
    image: ${IMAGE:?IMAGE is required}
    restart: unless-stopped
    pull_policy: always
    environment:
      APP_URL: ${APP_URL:?APP_URL is required}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
